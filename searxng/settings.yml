use_default_settings:
  engines:
    # Brave is excluded because it suspends indefinitely due to rate limiting (suspended_time=180).
    # brave.images / brave.videos / brave.news reference network: brave, so removing
    # only the main engine causes a KeyError. Exclude all variants together.
    remove:
      - brave
      - brave.images
      - brave.videos
      - brave.news
      # Startpage is excluded because it always fails with JSONDecodeError.
      - startpage
      - startpage news
      - startpage images
      # aol is excluded because it always fails with 404.
      - aol
      # karmasearch is excluded because it always fails with 403 (access denied).
      - karmasearch
      - karmasearch videos
      # DuckDuckGo (legacy engine) is excluded because it always fails on CAPTCHA.
      # Note: "duckduckgo web" is a separate engine that works fine; we enable it below.
      - duckduckgo
      # wikidata is excluded because it fails to initialize with 403.
      - wikidata
      # ahmia / torch are Tor onion services and not needed for normal search.
      - ahmia
      - torch
      # Google is excluded because it always fails with IndexError (list index out of range).
      # SearXNG's google.py has not been updated for Google's HTML structure changes.
      - google
      - google images
      - google news
      - google videos

# Explicitly enable verified-working engines among those disabled by default.
# use_default_settings loads the default state of all engines, but
# mojeek / bing / duckduckgo web default to disabled=true, so we override
# them here with disabled: false.
engines:
  - name: mojeek
    disabled: false
  - name: bing
    disabled: false
  - name: duckduckgo web
    disabled: false

search:
  formats:
    - html
    - json

server:
  bind_address: "0.0.0.0"
  port: 8080
  secret_key: "umanschat-searxng-dev-secret"
  # No IP headers arrive for Docker internal traffic without a reverse proxy.
  # Disable the limiter to eliminate X-Forwarded-For errors.
  limiter: false

outgoing:
  using_tor_proxy: false
  # Engine timeout: at the default 3.0s, engines like Wikipedia frequently time out.
  # Raise to 10s to tolerate network fluctuation.
  request_timeout: 10.0
