# limiter.toml — SearXNG ボット検知設定
# Docker 内部ネットワーク（リバースプロキシ無し）での運用向け。
# server.limiter: false でも ProxyFix ミドルウェアは常にロードされ、
# X-Forwarded-For / X-Real-IP ヘッダー無しでエラーログが出る。
# trusted_proxies に Docker サブネットを含めることで内部通信を許容する。

[botdetection]
# クライアントネットワーク判定のプレフィックス長
ipv4_prefix = 32
ipv6_prefix = 48

# Docker 内部ネットワークからのリクエストを信頼プロキシとして扱い、
# X-Forwarded-For / X-Real-IP ヘッダーが無くても REMOTE_ADDR を使用。
trusted_proxies = [
  '127.0.0.0/8',
  '::1',
  '172.16.0.0/12',
  '10.0.0.0/8',
  '192.168.0.0/16',
  'fd00::/8',
]
