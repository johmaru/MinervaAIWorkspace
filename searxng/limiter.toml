# limiter.toml — SearXNG bot detection settings
# For use on the Docker internal network (without a reverse proxy).
# Even with server.limiter: false, the ProxyFix middleware is always loaded and
# emits error logs when X-Forwarded-For / X-Real-IP headers are absent.
# Including the Docker subnet in trusted_proxies tolerates internal traffic.

[botdetection]
# Prefix length for client network determination
ipv4_prefix = 32
ipv6_prefix = 48

# Treat requests from the Docker internal network as trusted proxies and use
# REMOTE_ADDR when X-Forwarded-For / X-Real-IP headers are absent.
trusted_proxies = [
  '127.0.0.0/8',
  '::1',
  '172.16.0.0/12',
  '10.0.0.0/8',
  '192.168.0.0/16',
  'fd00::/8',
]
