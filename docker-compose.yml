services:
  # リリース配布: デフォルトで GHCR の公開イメージを使用。
  #   docker compose pull          (GHCR のリリースイメージを取得)
  #   docker compose up -d         (取得済みイメージで起動)
  # ローカル開発 (ソースからビルド):
  #   docker compose up -d --build
  app:
    image: ${UMANSCHAT_APP_IMAGE:-ghcr.io/johmaru/umanschat-unofficial-app:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: umanschat-app
    restart: unless-stopped
    depends_on:
      embedder:
        condition: service_started
      scraper:
        condition: service_started
    # ホストの .env をマウント: GUI で設定変更した .env が
    # 再ビルド後も保持される（イメージに焼き込まれない）
    volumes:
      - ./.env:/app/.env
      # SQLite データ永続化: data/umanschat.db をホストに保持
      - ./data:/app/data
      # Tor コンテナ起動/停止用: Docker socket + compose ファイルをマウント
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker-compose.yml:/app/docker-compose.yml:ro
    env_file:
      - .env
    environment:
      SCRAPER_URL: http://scraper:8000
      SEARXNG_URL: http://searxng:8080
      EMBEDDER_URL: http://embedder:8001
      # EMBED_* / WEB_SEARCH_* / THINKING_EFFORT / TOR_PROXY / SCRAPE_PROXY / DATABASE_URL は
      # .env ファイルから読み込む（GUI 書き換え対応）
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_TRUST_HOST: "true"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    ports:
      - "3001:3000"  # Cloudflare Tunnel 使用時も localhost:3001 で直接確認可能

  # Cloudflare Tunnel: 名前付きトンネルで app をパブリック HTTPS で公開。
  # TUNNEL_TOKEN 未設定時は起動せず、localhost:3001 で直接アクセス可能。
  # トンネル作成手順:
  #   1. https://one.dash.cloudflare.com/ → Networks → Tunnels → Create a tunnel
  #   2. タイプ: Cloudflared → トンネル名を指定（例: umanschat）
  #   3. Public Hostname で app サービスにルーティング: Service=http://app:3000
  #   4. 発行されたトークンを .env の TUNNEL_TOKEN に設定
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: umanschat-cloudflared
    restart: unless-stopped
    depends_on:
      - app
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    profiles: ["tunnel"]  # --profile tunnel で有効化。TUNNEL_TOKEN 未設定時は起動しない

  scraper:
    image: ${UMANSCHAT_SCRAPER_IMAGE:-ghcr.io/johmaru/umanschat-unofficial-scraper:latest}
    build:
      context: ./scraper
      dockerfile: Dockerfile
    container_name: umanschat-scraper
    restart: unless-stopped
    expose:
      - "8000"
    depends_on:
      - searxng
    environment:
      SCRAPE_TIMEOUT: ${SCRAPE_TIMEOUT:-30}
      SEARXNG_URL: http://searxng:8080
      SCRAPE_PROXY: ${SCRAPE_PROXY:-}

  embedder:
    image: ${UMANSCHAT_EMBEDDER_IMAGE:-ghcr.io/johmaru/umanschat-unofficial-embedder:latest}
    build:
      context: ./embedder
      dockerfile: Dockerfile
    container_name: umanschat-embedder
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      EMBEDDER_MODEL: ${EMBEDDER_MODEL:-LiquidAI/LFM2.5-Embedding-350M}
    # GPU が利用可能な環境でのみ有効化（EMBEDDER_GPU_COUNT>=1 時）。
    # 未設定時は count:0 で CPU フォールバック（Docker Compose v2.18+ で安全）。
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${EMBEDDER_GPU_COUNT:-0}
              capabilities: [gpu]
    volumes:
      - umanschat-embedder-hf:/root/.cache/huggingface

  searxng:
    image: searxng/searxng:latest
    container_name: umanschat-searxng
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - ./searxng/limiter.toml:/etc/searxng/limiter.toml:ro
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080
    depends_on:
      - tor

  tor:
    image: dperson/torproxy:latest
    container_name: umanschat-tor
    restart: unless-stopped
    expose:
      - "9050"
      - "9051"
    environment:
      - TORPASSWORD=umanschat-tor-control

volumes:
  umanschat-embedder-hf:
