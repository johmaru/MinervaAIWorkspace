services:
  # Release distribution: use the public GHCR image by default.
  #   docker compose pull          (pull the release image from GHCR)
  #   docker compose up -d         (start with the pulled image)
  # Local development (build from source):
  #   docker compose up -d --build
  app:
    image: ${UMANSCHAT_APP_IMAGE:-ghcr.io/johmaru/umanschat-unofficial-app:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: umanschat-app
    restart: unless-stopped
    depends_on:
      embedder:
        condition: service_started
      scraper:
        condition: service_started
    # Mount the host's .env: .env changes made via the GUI persist
    # across rebuilds (not baked into the image)
    volumes:
      - ./.env:/app/.env
      # SQLite data persistence: keep data/umanschat.db on the host
      - ./data:/app/data
      # Chat export: mount a host directory into the container.
      # Set CHAT_EXPORT_HOST_PATH in .env to a host path (use forward slashes on Windows: C:/Users/...).
      # When empty, defaults to ./data/chat-export (no special host path).
      - ${CHAT_EXPORT_HOST_PATH:-./data/chat-export}:/app/chat-export
      # Sandbox (v0.4): mount the host Docker socket so the app can spawn
      # sibling sandbox containers (Docker-in-Docker sibling pattern).
      # The app image includes the `docker` CLI (Dockerfile installs docker.io).
      # Without this, sandbox_run is auto-off.
      - /var/run/docker.sock:/var/run/docker.sock
      # Workspace: mount a host folder so AI file tools (read_file/write_file/
      # list_directory/run_command) operate on user-selected files.
      # Set WORKSPACE_HOST_PATH in .env to a host path (forward slashes on Windows).
      # When empty, defaults to ./data/workspace (inside the already-mounted data volume).
      - ${WORKSPACE_HOST_PATH:-./data/workspace}:/app/workspace
    env_file:
      - .env
    environment:
      SCRAPER_URL: http://scraper:8000
      SEARXNG_URL: http://searxng:8080
      EMBEDDER_URL: http://embedder:8001
      DOCKER_ENV: "true"
      # EMBED_* / WEB_SEARCH_* / THINKING_EFFORT / TOR_PROXY / SCRAPE_PROXY / DATABASE_URL are
      # read from the .env file (supports GUI editing)
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_TRUST_HOST: "true"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Chat export: in-container path is always /app/chat-export when CHAT_EXPORT_HOST_PATH is set.
      # This overrides the .env value so the app writes to the mounted directory.
      CHAT_EXPORT_PATH: ${CHAT_EXPORT_HOST_PATH:+/app/chat-export}
      CHAT_EXPORT_MODE: ${CHAT_EXPORT_MODE:-daily}
    ports:
      - "3001:3000"  # Also accessible via localhost:3001 when using Cloudflare Tunnel

  # Sandbox image (v0.4): prebuilt image for code_run execution.
  # This service is NOT started — it only triggers `docker compose build`
  # to build the image into the host's image store. The app spawns siblings
  # from it via the mounted docker.sock.
  # Run: docker compose build sandbox
  sandbox:
    image: umanschat-sandbox-python:v0.4
    build:
      context: ./sandbox/python
      dockerfile: Dockerfile
    profiles: ["sandbox"]  # opt-in: build with `docker compose --profile sandbox build`

  # Cloudflare Tunnel: expose the app over public HTTPS via a named tunnel.
  # When TUNNEL_TOKEN is not set, this does not start; access directly via localhost:3001.
  # Tunnel creation steps:
  #   1. https://one.dash.cloudflare.com/ → Networks → Tunnels → Create a tunnel
  #   2. Type: Cloudflared → specify a tunnel name (e.g. umanschat)
  #   3. Route to the app service via Public Hostname: Service=http://app:3000
  #   4. Set the issued token as TUNNEL_TOKEN in .env
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: umanschat-cloudflared
    restart: unless-stopped
    depends_on:
      - app
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    profiles: ["tunnel"]  # Activated with --profile tunnel. Does not start when TUNNEL_TOKEN is unset

  scraper:
    image: ${UMANSCHAT_SCRAPER_IMAGE:-ghcr.io/johmaru/umanschat-unofficial-scraper:latest}
    build:
      context: ./scraper
      dockerfile: Dockerfile
    container_name: umanschat-scraper
    restart: unless-stopped
    expose:
      - "8000"
    depends_on:
      - searxng
    environment:
      SCRAPE_TIMEOUT: ${SCRAPE_TIMEOUT:-30}
      SEARXNG_URL: http://searxng:8080
      SCRAPE_PROXY: ${SCRAPE_PROXY:-}

  embedder:
    image: ${UMANSCHAT_EMBEDDER_IMAGE:-ghcr.io/johmaru/umanschat-unofficial-embedder:latest}
    build:
      context: ./embedder
      dockerfile: Dockerfile
    container_name: umanschat-embedder
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      EMBEDDER_MODEL: ${EMBEDDER_MODEL:-LiquidAI/LFM2.5-Embedding-350M}
    # Only enabled when a GPU is available (EMBEDDER_GPU_COUNT>=1).
    # When unset, count:0 provides CPU fallback (safe with Docker Compose v2.18+).
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${EMBEDDER_GPU_COUNT:-0}
              capabilities: [gpu]
    volumes:
      - umanschat-embedder-hf:/root/.cache/huggingface

  searxng:
    image: searxng/searxng:latest
    container_name: umanschat-searxng
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - ./searxng/limiter.toml:/etc/searxng/limiter.toml:ro
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080
      - SEARXNG_SECRET_KEY=${SEARXNG_SECRET_KEY:-umanschat-searxng-dev-secret}
    depends_on:
      - tor

  tor:
    image: dperson/torproxy:latest
    container_name: umanschat-tor
    restart: unless-stopped
    expose:
      - "9050"
      - "9051"
    environment:
      - TORPASSWORD=umanschat-tor-control

volumes:
  umanschat-embedder-hf:
